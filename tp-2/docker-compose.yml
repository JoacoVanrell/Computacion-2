services:
  api:
    build: .
    container_name: compu2-tareas

    # puerto del host : puerto del contenedor
    ports:
      - "8000:8000"

    # Se leen en app/config.py. Cambiar acá y volver a levantar.
    environment:
      WORKERS: "4"
      MAXSIZE_COLA: "100"
      USAR_EXECUTOR: "1"     # 0 = hashear dentro del loop (para la medición 2)
      LIMITE_APAGADO: "5"    # menor que stop_grace_period: queda tiempo para el JSON
      DIR_ESTADOS: "/app/estados"

    # Los estado_<timestamp>.json quedan en tu máquina, no mueren con el contenedor.
    volumes:
      - ./estados:/app/estados

    # Lo que Docker espera después del SIGTERM antes de mandar SIGKILL.
    # (10 s es el valor por defecto; lo dejo escrito para que se vea.)
    stop_grace_period: 10s
